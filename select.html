                        <span class="kana-spacer"></span>
                        <button class="kana-card" data-char="れ">れ</button>
                    </div>

                    <!-- お行 -->
                    <div class="kana-column">
                        <button class="kana-card" data-char="お">お</button>

                        <button class="kana-card" data-char="タ">タ</button>
                        <button class="kana-card" data-char="ナ">ナ</button>
                        <button class="kana-card" data-char="ハ">ハ</button>
                        <button class="kana-card" data-char="マ">マ</button>
                        <button class="kana-card" data-char="ヤ">ヤ</button>
                        <button class="kana-card" data-char="ラ">ラ</button>
                        <button class="kana-card" data-char="ワ">ワ</button>
                    </div>

                    <!-- い行 -->
                    <div class="kana-column">
                        <button class="kana-card" data-char="イ">イ</button>
                        <button class="kana-card" data-char="キ">キ</button>
                        <button class="kana-card" data-char="シ">シ</button>
                        <button class="kana-card" data-char="チ">チ</button>
                        <button class="kana-card" data-char="ニ">ニ</button>
                        <button class="kana-card" data-char="ヒ">ヒ</button>
                        <button class="kana-card" data-char="ミ">ミ</button>
                        <span class="kana-spacer"></span>
                        <button class="kana-card" data-char="リ">リ</button>
                        <button class="kana-card" data-char="ヲ">ヲ</button>
                    </div>

                    <!-- う行 -->
                    <div class="kana-column">
                        <button class="kana-card" data-char="ウ">ウ</button>
                        <button class="kana-card" data-char="ク">ク</button>
                        <button class="kana-card" data-char="ス">ス</button>
                        <button class="kana-card" data-char="ツ">ツ</button>
                        <button class="kana-card" data-char="ヌ">ヌ</button>
                        <button class="kana-card" data-char="フ">フ</button>

                    <!-- え行 -->

                        <button class="kana-card" data-char="ネ">ネ</button>

                        <span class="kana-spacer"></span>

                        <button class="kana-card" data-char="ホ">ホ</button>

                    <!-- 修飾ボタン（わ行の左） -->
                    <div class="kana-column modifiers">
                        <button class="modifier-btn" id="toggleDakutenKata" title="濁音">゛</button>
                        <button class="modifier-btn" id="toggleHandakutenKata" title="半濁音">゜</button>
                        <button class="modifier-btn" id="toggleSmallKata" title="小文字">ァ</button>
                        <button class="modifier-btn" id="toggleHiragana" title="ひらがな">あ</button>
                    </div>
                </div>
            </div>

            <!-- 選択済み文字表示（五十音表の下） -->
            <div class="selected-word-section">
                <h3>えらんだもじ</h3>
                <div class="selected-cards-display" id="selectedCardsDisplay"></div>
            </div>

            <!-- 操作ボタン -->
            <div class="button-controls">
                <button class="control-btn btn-delete-one" id="deleteOneBtn">１もじけす</button>
                <button class="control-btn btn-delete-all" id="deleteAllBtn">ぜんぶけす</button>
                <button class="submit-btn" id="submitBtn" disabled>もんだいをだす</button>
            </div>

            <!-- トップに戻るリンク -->
            <div class="back-link-section">
                <a href="index.html" class="back-link">← もどる</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let selectedCharacters = [];
        let isKatakana = false;
        let isDakuten = false;
        let isHandakuten = false;
        let isSmall = false;

        // 濁音・半濁音マッピング
        const dakuntenMap = {
            'か': 'が', 'き': 'ぎ', 'く': 'ぐ', 'け': 'げ', 'こ': 'ご',
            'さ': 'ざ', 'し': 'じ', 'す': 'ず', 'せ': 'ぜ', 'そ': 'ぞ',
            'た': 'だ', 'ち': 'ぢ', 'つ': 'づ', 'て': 'で', 'と': 'ど',
            'は': 'ば', 'ひ': 'び', 'ふ': 'ぶ', 'へ': 'べ', 'ほ': 'ぼ'
        };

        const handakuntenMap = {
            'は': 'ぱ', 'ひ': 'ぴ', 'ふ': 'ぷ', 'へ': 'ぺ', 'ほ': 'ぽ'
        };

        const smallMap = {
            'あ': 'ぁ', 'い': 'ぃ', 'う': 'ぅ', 'え': 'ぇ', 'お': 'ぉ',
            'や': 'ゃ', 'ゆ': 'ゅ', 'よ': 'ょ',
            'わ': 'ゎ', 'つ': 'っ'
        };

        const katakanaDakuntenMap = {
            'カ': 'ガ', 'キ': 'ギ', 'ク': 'グ', 'ケ': 'ゲ', 'コ': 'ゴ',
            'サ': 'ザ', 'シ': 'ジ', 'ス': 'ズ', 'セ': 'ゼ', 'ソ': 'ゾ',
            'タ': 'ダ', 'チ': 'ヂ', 'ツ': 'ヅ', 'テ': 'デ', 'ト': 'ド',
            'ハ': 'バ', 'ヒ': 'ビ', 'フ': 'ブ', 'ヘ': 'ベ', 'ホ': 'ボ'
        };

        const katakanaHandakuntenMap = {
            'ハ': 'パ', 'ヒ': 'ピ', 'フ': 'プ', 'ヘ': 'ペ', 'ホ': 'ポ'
        };

        const katakanaSmallMap = {
            'ア': 'ァ', 'イ': 'ィ', 'ウ': 'ゥ', 'エ': 'ェ', 'オ': 'ォ',
            'ヤ': 'ャ', 'ユ': 'ュ', 'ヨ': 'ョ',
            'ワ': 'ヮ', 'ツ': 'ッ'
        };

        // 初期化
        function init() {
            setupKanaCardListeners();
            setupControlButtons();
            updateDisplay();
        }

        // 五十音カードのイベントリスナー設定
        function setupKanaCardListeners() {
            document.querySelectorAll('.kana-card').forEach(btn => {
                btn.addEventListener('click', () => selectCharacter(btn.dataset.char));
            });
        }

        // 制御ボタンのイベントリスナー設定
        function setupControlButtons() {
            // ひらがな修飾ボタン
            document.getElementById('toggleDakuten').addEventListener('click', () => {
                isDakuten = !isDakuten;
                isHandakuten = false;
                updateModifierButtons();
            });

            document.getElementById('toggleHandakuten').addEventListener('click', () => {
                isHandakuten = !isHandakuten;
                isDakuten = false;
                updateModifierButtons();
            });

            document.getElementById('toggleSmall').addEventListener('click', () => {
                isSmall = !isSmall;
                updateModifierButtons();
            });

            document.getElementById('toggleKatakana').addEventListener('click', () => {
                isKatakana = true;
                isDakuten = false;
                isHandakuten = false;
                isSmall = false;
                document.querySelector('.kana-display').style.display = 'none';
                document.getElementById('katakanaDisplay').style.display = 'flex';
                updateModifierButtons();
            });

            // カタカナ修飾ボタン
            document.getElementById('toggleDakutenKata').addEventListener('click', () => {
                isDakuten = !isDakuten;
                isHandakuten = false;
                updateModifierButtons();
            });

            document.getElementById('toggleHandakutenKata').addEventListener('click', () => {
                isHandakuten = !isHandakuten;
                isDakuten = false;
                updateModifierButtons();
            });

            document.getElementById('toggleSmallKata').addEventListener('click', () => {
                isSmall = !isSmall;
                updateModifierButtons();
            });

            document.getElementById('toggleHiragana').addEventListener('click', () => {
                isKatakana = false;
                isDakuten = false;
                isHandakuten = false;
                isSmall = false;
                document.querySelector('.kana-display').style.display = 'flex';
                document.getElementById('katakanaDisplay').style.display = 'none';
                updateModifierButtons();
            });

            // 削除ボタン
            document.getElementById('deleteOneBtn').addEventListener('click', () => {
                selectedCharacters.pop();
                updateDisplay();
            });

            document.getElementById('deleteAllBtn').addEventListener('click', () => {
                selectedCharacters = [];
                updateDisplay();
            });

            // 送信ボタン
            document.getElementById('submitBtn').addEventListener('click', () => {
                sessionStorage.setItem('selectedWord', JSON.stringify(selectedCharacters));
                window.location.href = 'play.html';
            });
        }

        // 文字を選択
        function selectCharacter(char) {
            let selectedChar = char;

            // 修飾を適用
            if (isDakuten) {
                if (isKatakana) {
                    selectedChar = katakanaDakuntenMap[char] || char;
                } else {
                    selectedChar = dakuntenMap[char] || char;
                }
            } else if (isHandakuten) {
                if (isKatakana) {
                    selectedChar = katakanaHandakuntenMap[char] || char;
                } else {
                    selectedChar = handakuntenMap[char] || char;
                }
            }

            if (isSmall) {
                if (isKatakana) {
                    selectedChar = katakanaSmallMap[selectedChar] || selectedChar;
                } else {
                    selectedChar = smallMap[selectedChar] || selectedChar;
                }
            }

            selectedCharacters.push(selectedChar);
            updateDisplay();
            isDakuten = false;
            isHandakuten = false;
            isSmall = false;
            updateModifierButtons();
        }

        // 表示を更新
        function updateDisplay() {
            const cardsContainer = document.getElementById('selectedCardsDisplay');
            cardsContainer.innerHTML = '';

            selectedCharacters.forEach((char) => {
                const card = document.createElement('div');
                card.className = 'selected-word-card';
                card.textContent = char;
                cardsContainer.appendChild(card);
            });

            document.getElementById('submitBtn').disabled = selectedCharacters.length === 0;
        }

        // 修飾ボタンの表示を更新
        function updateModifierButtons() {
            if (isKatakana) {
                document.getElementById('toggleDakutenKata').classList.toggle('active', isDakuten);
                document.getElementById('toggleHandakutenKata').classList.toggle('active', isHandakuten);
                document.getElementById('toggleSmallKata').classList.toggle('active', isSmall);
            } else {
                document.getElementById('toggleDakuten').classList.toggle('active', isDakuten);
                document.getElementById('toggleHandakuten').classList.toggle('active', isHandakuten);
                document.getElementById('toggleSmall').classList.toggle('active', isSmall);
            }
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
