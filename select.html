                    <button class="modifier-btn" id="toggleHandakutenKata" title="半濁音">゜</button>
                    <button class="modifier-btn" id="toggleSmallKata" title="小文字">ァ</button>

            <div class="selected-word-section">

            <div class="button-controls">

    <script>
        let selectedCharacters = [];
        let isKatakana = false;
        let isDakuten = false;
        let isHandakuten = false;
        let isSmall = false;

        // マッピングデータ
        const dakuntenMap = { 'あ':'あ','い':'い','う':'う','え':'え','お':'お','か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','な':'な','に':'に','ぬ':'ぬ','ね':'ね','の':'の','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ','ま':'ま','み':'み','む':'む','め':'め','も':'も','や':'や','ゆ':'ゆ','よ':'よ','ら':'ら','り':'り','る':'る','れ':'れ','ろ':'ろ','わ':'わ','を':'を','ん':'ん' };
        const handakuntenMap = { 'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ' };
        const smallMap = { 'あ':'ぁ','い':'ぃ','う':'ぅ','え':'ぇ','お':'ぉ','や':'ゃ','ゆ':'ゅ','よ':'ょ','わ':'ゎ','つ':'っ' };
        
        const katakanaDakuntenMap = { 'ア':'ア','イ':'イ','ウ':'ウ','エ':'エ','オ':'オ','カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ','サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ','タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド','ナ':'ナ','ニ':'ニ','ヌ':'ヌ','ネ':'ネ','ノ':'ノ','ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ','マ':'マ','ミ':'ミ','ム':'ム','メ':'メ','モ':'モ','ヤ':'ヤ','ユ':'ユ','ヨ':'ヨ','ラ':'ラ','リ':'リ','ル':'ル','レ':'レ','ロ':'ロ','ワ':'ワ','ヲ':'ヲ','ン':'ン','ー':'ー' };
        const katakanaHandakuntenMap = { 'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ' };
        const katakanaSmallMap = { 'ア':'ァ','イ':'ィ','ウ':'ゥ','エ':'ェ','オ':'ォ','ヤ':'ャ','ユ':'ュ','ヨ':'ョ','ワ':'ヮ','ツ':'ッ' };

        function init() {
            setupKanaCardListeners();
            setupControlButtons();
            updateDisplay();
        }

        function setupKanaCardListeners() {
            // イベントデリゲーションを使用して、動的に表示されるボタンにも対応
            document.body.addEventListener('click', (e) => {
                if (e.target.classList.contains('kana-card')) {
                    selectCharacter(e.target.dataset.char);
                }
            });
        }

        function setupControlButtons() {
            const safeAdd = (id, fn) => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('click', fn);
            };

            safeAdd('toggleDakuten', () => { isDakuten = !isDakuten; isHandakuten = false; updateModifierButtons(); });
            safeAdd('toggleHandakuten', () => { isHandakuten = !isHandakuten; isDakuten = false; updateModifierButtons(); });
            safeAdd('toggleSmall', () => { isSmall = !isSmall; updateModifierButtons(); });
            safeAdd('toggleKatakana', () => {
                isKatakana = true; resetModifiers();
                document.getElementById('hiraganaDisplay').style.display = 'none';
                document.getElementById('katakanaDisplay').style.display = 'flex';
                document.getElementById('hiraganaModifiers').style.display = 'none';
                document.getElementById('katakanaModifiers').style.display = 'flex';
                updateModifierButtons();
            });

            safeAdd('toggleDakutenKata', () => { isDakuten = !isDakuten; isHandakuten = false; updateModifierButtons(); });
            safeAdd('toggleHandakutenKata', () => { isHandakuten = !isHandakuten; isDakuten = false; updateModifierButtons(); });
            safeAdd('toggleSmallKata', () => { isSmall = !isSmall; updateModifierButtons(); });
            safeAdd('toggleHiragana', () => {
                isKatakana = false; resetModifiers();
                document.getElementById('hiraganaDisplay').style.display = 'flex';
                document.getElementById('katakanaDisplay').style.display = 'none';
                document.getElementById('hiraganaModifiers').style.display = 'flex';
                document.getElementById('katakanaModifiers').style.display = 'none';
                updateModifierButtons();
            });

            safeAdd('deleteOneBtn', () => { selectedCharacters.pop(); updateDisplay(); });
            safeAdd('deleteAllBtn', () => { selectedCharacters = []; updateDisplay(); });
            safeAdd('submitBtn', () => {
                sessionStorage.setItem('selectedWord', JSON.stringify(selectedCharacters));
                window.location.href = 'play.html';
            });
        }

        function resetModifiers() {
            isDakuten = false; isHandakuten = false; isSmall = false;
        }

        function selectCharacter(char) {
            let selectedChar = char;
            if (char !== 'ー') { // 長音符には修飾を適用しない
                if (isDakuten) {
                    selectedChar = (isKatakana ? katakanaDakuntenMap[char] : dakuntenMap[char]) || char;
                } else if (isHandakuten) {
                    selectedChar = (isKatakana ? katakanaHandakuntenMap[char] : handakuntenMap[char]) || char;
                }
                if (isSmall) {
                    selectedChar = (isKatakana ? katakanaSmallMap[selectedChar] : smallMap[selectedChar]) || selectedChar;
                }
            }
            selectedCharacters.push(selectedChar);
            updateDisplay();
            resetModifiers();
            updateModifierButtons();
        }

        function updateDisplay() {
            const container = document.getElementById('selectedCardsDisplay');
            container.innerHTML = '';
            selectedCharacters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'selected-word-card';
                card.textContent = char;
                container.appendChild(card);
            });
            document.getElementById('submitBtn').disabled = selectedCharacters.length === 0;
        }

        function updateModifierButtons() {
            const suffix = isKatakana ? 'Kata' : '';
            const dakutenBtn = document.getElementById('toggleDakuten' + suffix);
            const handakutenBtn = document.getElementById('toggleHandakuten' + suffix);
            const smallBtn = document.getElementById('toggleSmall' + suffix);
            
            // 全ボタンからactiveを一旦消去
            document.querySelectorAll('.modifier-btn').forEach(btn => btn.classList.remove('active'));
            
            if(isDakuten && dakutenBtn) dakutenBtn.classList.add('active');
            if(isHandakuten && handakutenBtn) handakutenBtn.classList.add('active');
            if(isSmall && smallBtn) smallBtn.classList.add('active');
        }

        init();
    </script>
