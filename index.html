<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひらがなかたかなならびかえ - がくしゅうサイト</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="top-page">
    <div class="container">
        <header class="header">
            <h1 class="title">ひらがなかたかなならびかえ</h1>
        </header>

        <main class="main-content">
            <!-- イメージイラスト代わり -->
            <div class="hero-section">
                <div class="character-cards-demo">
                    <div class="demo-card">り</div>
                    <div class="demo-card">ん</div>
                    <div class="demo-card">ご</div>
                </div>
            </div>

            <!-- 使い方説明 -->
            <section class="instructions">
                <h2>🎮 このサイトについて</h2>
                <p>ばらばらになった もじを　ならびかえて、ことばを　かんせいさせよう！</p>
                <p>おともだちと　いっしょに　あそべる　がくしゅう　ゲームです。</p>
            </section>

            <!-- 遊び方ガイド -->
            <section class="how-to">
                <h2>📖 あそびかた</h2>
                
                <div class="guide-step">
                    <div class="step-number">①</div>
                    <h3>もんだいを　つくろう</h3>
                    <p>あいてに　こたえてもらう　ことばを　えらびます。</p>
                </div>

                <div class="guide-step">
                    <div class="step-number">②</div>
                    <h3>もんだいを　たしかめよう</h3>
                    <p>ことばが　ただしく　ならんでいるか　かくにんします。</p>
                </div>

                <div class="guide-step">
                    <div class="step-number">③</div>
                    <h3>もんだいを　こたえよう</h3>
                    <p>ばらばらな　ことばを　ならびかえて　なにになるか　わかったら　こえにだして　いおう。</p>
                </div>
            </section>

            <!-- 始めるボタン -->
            <section class="start-section">
                <button class="btn-large btn-primary" onclick="location.href='select.html'">
                    🎮 あそぶ
                </button>
            </section>
        </main>

        <footer class="footer">
            <p>たのしく　まなぼう！</p>
        </footer>
    </div>
</body>
</html>
