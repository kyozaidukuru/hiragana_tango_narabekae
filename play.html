<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解答 - ひらがなかたかなならびかえ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="play-page">
    <div class="play-container">
        <div class="play-header">
            <h1>🎲 ならびかえて　ことばにしよう</h1>
        </div>

        <div class="cards-container" id="cardsContainer">
            <!-- カードがここに配置される -->
        </div>

        <div class="play-buttons">
            <button class="btn-answer" id="answerBtn">こたえ</button>
            <button class="btn-back" id="backBtn">← もどる</button>
        </div>
    </div>

    <!-- 答え表示モーダル -->
    <div class="modal" id="answerModal">
        <div class="modal-content">
            <h2>せいかいは</h2>
            <div class="answer-display" id="answerDisplay"></div>
            <p class="continue-hint">がめんをたっぷして　つづける</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let cards = [];
        let selectedWord = [];
        let draggedCard = null;
        let offsetX = 0;
        let offsetY = 0;

        // 初期化
        function init() {
            const wordData = sessionStorage.getItem('selectedWord');
            if (!wordData) {
                alert('もんだいが　えらばれていません。');
                window.location.href = 'select.html';
                return;
            }

            selectedWord = JSON.parse(wordData);
            createCards();
            setupEventListeners();
        }

        // カードを作成
        function createCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            // カードをシャッフルして配置
            const shuffled = [...selectedWord].sort(() => Math.random() - 0.5);

            shuffled.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = char;
                card.id = 'card-' + index;

                // ランダムな位置に配置
                const randomX = Math.random() * (container.offsetWidth - 100);
                const randomY = Math.random() * (container.offsetHeight - 100);
                card.style.left = randomX + 'px';
                card.style.top = randomY + 'px';

                // マウスイベント
                card.addEventListener('mousedown', handleMouseDown);
                card.addEventListener('mousemove', handleMouseMove);
                card.addEventListener('mouseup', handleMouseUp);
                card.addEventListener('mouseleave', handleMouseUp);

                // タッチイベント
                card.addEventListener('touchstart', handleTouchStart);
                card.addEventListener('touchmove', handleTouchMove);
                card.addEventListener('touchend', handleTouchEnd);

                container.appendChild(card);
                cards.push({
                    element: card,
                    character: char,
                    x: randomX,
                    y: randomY
                });
            });
        }

        // マウスイベント
        function handleMouseDown(e) {
            draggedCard = this;
            const rect = this.getBoundingClientRect();
            const container = document.getElementById('cardsContainer');
            const containerRect = container.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            this.style.zIndex = 1000;
        }

        function handleMouseMove(e) {
            if (!draggedCard || draggedCard !== this) return;

            const container = document.getElementById('cardsContainer');
            const containerRect = container.getBoundingClientRect();

            let x = e.clientX - containerRect.left - offsetX;
            let y = e.clientY - containerRect.top - offsetY;

            // 境界チェック
            x = Math.max(0, Math.min(x, containerRect.width - this.offsetWidth));
            y = Math.max(0, Math.min(y, containerRect.height - this.offsetHeight));

            this.style.left = x + 'px';
            this.style.top = y + 'px';
        }

        function handleMouseUp(e) {
            if (draggedCard) {
                draggedCard.style.zIndex = 'auto';
                draggedCard = null;
            }
        }

        // タッチイベント
        function handleTouchStart(e) {
            draggedCard = this;
            const touch = e.touches[0];
            const rect = this.getBoundingClientRect();
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;
            this.style.zIndex = 1000;
        }

        function handleTouchMove(e) {
            if (!draggedCard || draggedCard !== this) return;

            const touch = e.touches[0];
            const container = document.getElementById('cardsContainer');
            const containerRect = container.getBoundingClientRect();

            let x = touch.clientX - containerRect.left - offsetX;
            let y = touch.clientY - containerRect.top - offsetY;

            // 境界チェック
            x = Math.max(0, Math.min(x, containerRect.width - this.offsetWidth));
            y = Math.max(0, Math.min(y, containerRect.height - this.offsetHeight));

            this.style.left = x + 'px';
            this.style.top = y + 'px';
        }

        function handleTouchEnd(e) {
            if (draggedCard) {
                draggedCard.style.zIndex = 'auto';
                draggedCard = null;
            }
        }

        // イベントリスナーの設定
        function setupEventListeners() {
            document.getElementById('answerBtn').addEventListener('click', showAnswer);
            document.getElementById('backBtn').addEventListener('click', goBack);
            document.getElementById('answerModal').addEventListener('click', handleModalClick);
        }

        
        // 答えを表示
        // 答えを表示
        function showAnswer() {
            const answer = selectedWord.join('');
            document.getElementById('answerDisplay').textContent = answer;

            // 正解の順に並べ替えのアニメーションを実行
            const container = document.getElementById('cardsContainer');
            const rect = container.getBoundingClientRect();
            
            const cardWidth = 90; // カードの横幅 (CSSの .card の幅に合わせる)
            const gap = 15;       // カード同士の間隔
            const totalWidth = selectedWord.length * cardWidth + (selectedWord.length - 1) * gap;
            
            // コンテナの中央に配置するための開始X座標を計算
            const startX = (rect.width - totalWidth) / 2;
            const targetY = (rect.height - cardWidth) / 2;

            // selectedWord（正しい順番）の文字と一致するように cards を並べ替える
            selectedWord.forEach((correctChar, index) => {
                const cardObj = cards.find(c => c.character === correctChar && !c.isAligned);
                if (cardObj) {
                    cardObj.isAligned = true; // 割り当て済みフラグ
                    const targetX = startX + index * (cardWidth + gap);
                    
                    cardObj.element.style.transition = 'all 0.5s ease';
                    cardObj.element.style.left = targetX + 'px';
                    cardObj.element.style.top = targetY + 'px';
                    cardObj.element.style.zIndex = 100; // 重なり順を前面に
                }
            });

            // 処理が終わったらフラグをリセット
            cards.forEach(c => delete c.isAligned);

            // 1.5秒（1500ミリ秒）のタイムラグを設けてからポップアップを表示
            setTimeout(() => {
                document.getElementById('answerModal').classList.add('active');
            }, 1500);
        }

        // モーダルをクリック
        function handleModalClick() {
            document.getElementById('answerModal').classList.remove('active');
            // select.htmlに戻る
            sessionStorage.removeItem('selectedWord');
            window.location.href = 'select.html';
        }

        // 戻る
        function goBack() {
            sessionStorage.removeItem('selectedWord');
            window.location.href = 'select.html';
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
